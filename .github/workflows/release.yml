name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches VERSION
        run: |
          version=$(cat VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version (expected v$version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: make lint
        run: make lint
      - name: make deb
        run: make deb
      - name: Prepare release files
        run: |
          cp "dist/apt-registry_${VERSION}_all.deb" dist/apt-registry_all.deb
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "See CHANGELOG.md." > dist/release-notes.md
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "apt-registry $VERSION" \
            --notes-file dist/release-notes.md \
            "dist/apt-registry_${VERSION}_all.deb" \
            dist/apt-registry_all.deb
